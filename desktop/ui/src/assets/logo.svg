<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- OnFlip's flip symbol in the workspace palette: mint and deep green
       on graphite. This is the master for renderer and packaged app icons. -->
  <rect width="1024" height="1024" rx="230" fill="#181D20"/>
  <defs>
    <clipPath id="disc">
      <circle cx="512" cy="512" r="345"/>
    </clipPath>
  </defs>

  <!-- the disc -->
  <circle cx="512" cy="512" r="345" fill="#17291D"/>

  <!-- white lobe: a big circle clipped to the disc leaves a black crescent -->
  <g clip-path="url(#disc)">
    <circle cx="624" cy="529" r="235" fill="#B7F5C1"/>

    <!-- white swoosh over the top: thin tail at 11 o'clock, thick head
         flowing into the lobe at 2 o'clock, hugging the rim the whole way -->
    <path fill="#B7F5C1" d="
      M 383 192
      A 345 345 0 0 1 853 464
      L 757 478
      A 300 300 0 0 0 456 195
      Z"/>
  </g>

  <!-- black arrowhead at the swoosh head, pointing clockwise (right/down) -->
  <path fill="#17291D" d="M 716 279 L 824 207 L 852 368 Z"/>

  <!-- white arrowhead at the bottom-left, pointing clockwise (left/up) -->
  <path fill="#B7F5C1" d="M 322 706 L 256 805 L 206 690 Z"/>

  <!-- bubbles: white on the black crescent -->
  <circle cx="355" cy="376" r="39" fill="#B7F5C1"/>
  <circle cx="316" cy="464" r="22" fill="#B7F5C1"/>
  <circle cx="347" cy="552" r="14" fill="#B7F5C1"/>

  <!-- bubbles: black on the white lobe -->
  <circle cx="696" cy="469" r="25" fill="#17291D"/>
  <circle cx="704" cy="578" r="40" fill="#17291D"/>
  <circle cx="673" cy="682" r="16" fill="#17291D"/>
</svg>

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here drives a browser, and downloading one is the slowest part of
# an install, so both browser downloads are skipped throughout.
env:
  ONFLIP_SKIP_BROWSER_DOWNLOAD: "1"
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  engine:
    name: engine · node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is a first-class target — the shell tool runs PowerShell and
        # cookie decryption uses DPAPI — so it is built, not assumed.
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 22 is what the release is built with; 24 is the current LTS and
        # what the maintainer runs, which CI had never tested. 20 left when
        # it reached end-of-life (April 2026).
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Install scripts are skipped deliberately: this job typechecks and
      # compiles TypeScript, and never loads the native sqlite binding, so
      # fetching or compiling one would be time spent on nothing.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build

      # The first thing in this repository's history that runs a line of the
      # code it ships. The suite is pure logic only — the failure taxonomy,
      # the tool-call parser, the refusal detectors — so it needs no browser,
      # no account and no network, and it runs in well under a second.
      #
      # Each failing test is also written as an annotation
      # (scripts/gha-reporter.mjs): a job's log needs admin rights to
      # download, its annotations do not, and a red run that says only
      # "exit code 1" is a red run nobody can read.
      - name: run the test suite
        run: >-
          node --test
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./scripts/gha-reporter.mjs --test-reporter-destination=stdout

  desktop:
    name: desktop app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # The desktop package depends on the engine through `file:..`, so the
      # engine has to be installed and built before it can be typechecked.
      # Desktop usage tests exercise the native SQLite store, so this job
      # must install better-sqlite3's platform binding. The engine matrix
      # above still skips scripts because it never loads that binding.
      - run: npm ci
      - run: npm run build

      - name: install desktop dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts

      - name: typecheck main, engine and renderer
        working-directory: desktop
        run: npm run typecheck

      - name: build the renderer
        working-directory: desktop
        run: npm run build

      # The whole suite, from the root, where both packages are now built.
      # `node --test` with no path is deliberate: a bare directory argument
      # is read as a module path on current Node and fails.
      #
      # That means the runner finds desktop/test/*.test.js from the engine
      # job too, which never builds desktop/dist. Each desktop test carries
      # its own `needsBuild` guard and skips itself there rather than dying
      # on a missing module; this is the job where they actually run. A new
      # desktop test without that guard turns every engine job red, which is
      # how this workflow spent five days failing on all seven jobs.
      - name: run the test suite, desktop tests included
        run: >-
          node --test
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./scripts/gha-reporter.mjs --test-reporter-destination=stdout

  # The Intel Mac, which nobody working on this has. The macOS release is
  # built on Apple Silicon, so the Intel app's default sqlite binding is
  # arm64, and an Intel Mac can only open sqlite through the darwin-x64
  # binding shipped in prebuilds/. Every release up to 0.10.55 got that
  # wrong, and nothing ran on an Intel Mac to say so. An Apple Silicon runner
  # reproduces it exactly: the Intel build of the app's Electron runs under
  # Rosetta, the arm64 binding this install builds is refused for its CPU,
  # and the check fails unless the shipped binding takes over.
  mac-intel-sqlite:
    name: sqlite on an Intel Mac (Rosetta)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # With install scripts, as the release installs: better-sqlite3 gets
      # the binding for this runner's own CPU, which is what the Intel app
      # ships as its default.
      - run: npm ci
      - run: npm run build

      # Every step here says what it found as an annotation, because a job's
      # log needs admin rights to read and its annotations do not: a red run
      # that says only "exit code 1" is one nobody can act on.
      - name: the default binding, as installed
        run: echo "::notice title=default sqlite binding::$(file node_modules/better-sqlite3/build/Release/better_sqlite3.node)"

      - name: install the Intel build of the app's Electron
        run: |
          enc() { node -e 'const s=require("fs").readFileSync(0,"utf8");process.stdout.write(s.replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A"))'; }
          version=$(node -p "require('./desktop/package-lock.json').packages['node_modules/electron'].version")
          mkdir -p "$RUNNER_TEMP/electron-x64"
          cd "$RUNNER_TEMP/electron-x64"
          npm init -y > /dev/null
          if ! npm install --no-audit --no-fund --no-save --ignore-scripts "electron@$version" > install.log 2>&1; then
            echo "::error title=Intel Electron install::$(tail -n 30 install.log | enc)"
            exit 1
          fi
          # The electron package has no install script to run: its binary is
          # fetched by install.js on first use, so fetch it now, for x64.
          # Three tries: GitHub's release downloads answer 500 now and then,
          # and a server hiccup is not a reason for this job to go red.
          fetched=false
          for attempt in 1 2 3; do
            if ELECTRON_INSTALL_ARCH=x64 node node_modules/electron/install.js >> install.log 2>&1; then
              fetched=true
              break
            fi
            echo "download attempt $attempt failed" >> install.log
            sleep $((attempt * 15))
          done
          if [ "$fetched" != true ]; then
            echo "::error title=Intel Electron download::$(tail -n 30 install.log | enc)"
            exit 1
          fi
          exe=node_modules/electron/dist/Electron.app/Contents/MacOS/Electron
          if [ ! -x "$exe" ]; then
            echo "::error title=Intel Electron install::no binary at $exe%0A$(tail -n 30 install.log | enc)"
            exit 1
          fi
          echo "::notice title=Intel Electron $version::$(file "$exe")"

      - name: make sure Rosetta can run it
        run: /usr/bin/arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license

      # Fails unless the default binding is refused for this CPU and the
      # shipped darwin-x64 one opens sqlite: see check-sqlite-fallback.js.
      - name: the arm64 binding is refused, and the shipped darwin-x64 one opens sqlite
        run: |
          enc() { node -e 'const s=require("fs").readFileSync(0,"utf8");process.stdout.write(s.replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A"))'; }
          electron="$RUNNER_TEMP/electron-x64/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron"
          if ELECTRON_RUN_AS_NODE=1 "$electron" scripts/check-sqlite-fallback.js . --expect-fallback > check.log 2>&1; then
            echo "::notice title=sqlite under Rosetta::$(enc < check.log)"
          else
            echo "::error title=sqlite under Rosetta::$(enc < check.log)"
            exit 1
          fi

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here drives a browser, and downloading one is the slowest part of
# an install, so both browser downloads are skipped throughout.
env:
  ONFLIP_SKIP_BROWSER_DOWNLOAD: "1"
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  engine:
    name: engine · node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is a first-class target — the shell tool runs PowerShell and
        # cookie decryption uses DPAPI — so it is built, not assumed.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  desktop:
    name: desktop app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # The desktop package depends on the engine through `file:..`, so the
      # engine has to be installed and built before it can be typechecked.
      - run: npm ci
      - run: npm run build

      - name: install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: typecheck main, engine and renderer
        working-directory: desktop
        run: npm run typecheck

      - name: build the renderer
        working-directory: desktop
        run: npm run build

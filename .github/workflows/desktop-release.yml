name: Desktop release

# Builds the OnFlip Desktop installers when a desktop-v<version> tag is
# pushed and publishes them as that tag's GitHub release — the release the
# in-app update check reads (desktop/electron/updates.ts). Windows goes
# first and creates the release; macOS (dmg + zip, arm64 and x64) is built
# on a real Mac — an .app carries symlinks and dmg needs hdiutil — and
# attached to the same release afterwards.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. desktop-v0.8.4)"
        required: true

permissions:
  contents: write

env:
  ONFLIP_SKIP_BROWSER_DOWNLOAD: "1"
  # No signing certificate in CI; build unsigned rather than fail. The mac
  # build ad-hoc signs itself in afterPack so Gatekeeper lets it be opened.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install core dependencies (builds dist/)
        run: npm install --no-audit --no-fund

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build the installer
        working-directory: desktop
        run: node scripts/release.js

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          ls -la desktop/release
          version="${TAG#desktop-v}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f desktop/RELEASE_NOTES.md ]; then
              gh release create "$TAG" --title "OnFlip Desktop $version" --notes-file desktop/RELEASE_NOTES.md
            else
              gh release create "$TAG" --title "OnFlip Desktop $version" --generate-notes
            fi
          fi
          gh release upload "$TAG" \
            desktop/release/OnFlip-Setup-*.exe \
            desktop/release/OnFlip-Setup-*.exe.blockmap \
            --clobber

  build-mac:
    runs-on: macos-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install core dependencies (builds dist/)
        run: npm install --no-audit --no-fund

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build macOS artifacts
        working-directory: desktop
        run: node scripts/release.js --mac

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          ls -la desktop/release
          gh release upload "$TAG" \
            desktop/release/OnFlip-*-mac-*.dmg \
            desktop/release/OnFlip-*-mac-*.zip \
            --clobber

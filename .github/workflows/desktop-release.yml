name: Desktop release

# Builds the OnFlip Desktop installers when a desktop-v<version> tag is
# pushed and publishes them as that tag's GitHub release — the release the
# in-app update check reads (desktop/electron/updates.ts). Windows goes
# first and creates the release; macOS (dmg + zip, arm64 and x64) is built
# on a real Mac — an .app carries symlinks and dmg needs hdiutil — and
# attached to the same release afterwards.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. desktop-v0.8.4)"
        required: true

permissions:
  contents: write

env:
  ONFLIP_SKIP_BROWSER_DOWNLOAD: "1"
  # No signing certificate in CI; build unsigned rather than fail. The mac
  # build ad-hoc signs itself in afterPack so Gatekeeper lets it be opened.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install core dependencies (builds dist/)
        run: |
          npm install --no-audit --no-fund ||
            { echo "install failed; retrying once in 20s"; sleep 20; npm install --no-audit --no-fund; }

      - name: Install desktop dependencies
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund ||
            { echo "install failed; retrying once in 20s"; sleep 20; npm install --no-audit --no-fund; }

      - name: Build the installer
        working-directory: desktop
        run: node scripts/release.js

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          ls -la desktop/release
          version="${TAG#desktop-v}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f desktop/RELEASE_NOTES.md ]; then
              gh release create "$TAG" --title "OnFlip Desktop $version" --notes-file desktop/RELEASE_NOTES.md
            else
              gh release create "$TAG" --title "OnFlip Desktop $version" --generate-notes
            fi
          fi
          # A digest anyone can check by hand against what they downloaded.
          # Deliberately not sold as supply-chain protection: it sits in the
          # same release as the artifact, so whoever could swap one could
          # swap both. What it covers is a corrupted or truncated object, and
          # a copy that came from somewhere other than this release.
          ( cd desktop/release && sha256sum OnFlip-Setup-*.exe > SHA256SUMS-windows.txt )
          cat desktop/release/SHA256SUMS-windows.txt
          gh release upload "$TAG" \
            desktop/release/OnFlip-Setup-*.exe \
            desktop/release/OnFlip-Setup-*.exe.blockmap \
            desktop/release/SHA256SUMS-windows.txt \
            --clobber

  build-mac:
    runs-on: macos-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install core dependencies (builds dist/)
        run: |
          npm install --no-audit --no-fund ||
            { echo "install failed; retrying once in 20s"; sleep 20; npm install --no-audit --no-fund; }

      - name: Install desktop dependencies
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund ||
            { echo "install failed; retrying once in 20s"; sleep 20; npm install --no-audit --no-fund; }

      - name: Build macOS artifacts
        working-directory: desktop
        run: node scripts/release.js --mac

      # Open sqlite inside each Mac build before it is published, from the
      # zip the updater will install, the way the app does with no Node on
      # the machine. The Intel build runs under Rosetta, where its arm64
      # default binding is refused exactly as on a real Intel Mac and only
      # the shipped darwin-x64 binding can answer — which every release up to
      # 0.10.55 shipped broken with nothing here to notice.
      - name: Check sqlite opens in both Mac builds
        shell: bash
        run: |
          /usr/bin/arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
          for arch in arm64 x64; do
            dir="$RUNNER_TEMP/check-$arch"
            rm -rf "$dir" && mkdir -p "$dir"
            ditto -x -k desktop/release/OnFlip-*-mac-$arch.zip "$dir"
            app="$dir/OnFlip.app"
            file "$app/Contents/MacOS/OnFlip"
            ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/OnFlip" scripts/check-sqlite-fallback.js "$app/Contents/Resources/app/node_modules/onflip"
          done

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          ls -la desktop/release
          ( cd desktop/release && shasum -a 256 OnFlip-*-mac-*.dmg OnFlip-*-mac-*.zip > SHA256SUMS-macos.txt )
          cat desktop/release/SHA256SUMS-macos.txt
          gh release upload "$TAG" \
            desktop/release/OnFlip-*-mac-*.dmg \
            desktop/release/OnFlip-*-mac-*.zip \
            desktop/release/SHA256SUMS-macos.txt \
            --clobber
